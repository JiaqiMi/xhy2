# Task1 比赛完整流程参数。
# launch 只负责编排节点；任务运行参数统一在本文件中修改。

# 主循环、坐标系、深度与启动航向
rate: 5.0
map_frame: map
# false：使用机器人启动时的当前深度；true：使用 reference_depth
use_reference_depth: true
reference_depth: -0.4
# false：使用机器人启动时的当前航向；true：先旋转到参考航向，
# 收到 HOVER 且识别/运动话题均有数据后，再定点缓冲 startup_hold_seconds
use_reference_yaw: true
reference_yaw_deg: -55.0
line_tracking_frame: camera

# motion_supervisor 接口
motion_goal_topic: /cmd/motion/goal
motion_cancel_topic: /cmd/motion/cancel
motion_state_topic: /motion/state
motion_state_timeout: 5.0

# 感知、完成和可视化话题
line_topic: /obj/line_message
target_topic: /obj/target_message
# 启动阶段只检查以下两个识别端原始输出是否收到任意消息，不解析内容
line_detection_ready_topic: /vision/line/detections
shape_detection_ready_topic: /vision/shapes/detections
camera_topic: /left/image_raw
actuator_topic: /cmd/actuator
finished_topic: /finished
trajectory_topic: /task1/trajectory

# 启动与搜索
startup_hold_seconds: 5.0
camera_message_timeout: 2.0
tf_timeout_seconds: 1.0
line_message_max_age_seconds: 5.0
search_forward_distance: 1.5 # 起始的前进距离
search_yaw_angle_deg: 45.0
search_yaw_sign: 1.0
# 一轮锁线前搜索：向前、左转、右转、回正；一轮锁线后搜索：左转、右转、回正
search_before_lock_max_cycles: 2
search_after_lock_max_cycles: 1
# 从首次进入 SEARCH_FORWARD 开始计时，默认最长执行 7 分钟
task_timeout_seconds: 420.0
# 正常确认终点时，实际推进小于此值则先前往绝对兜底点；达到此值则原地 FINISH
normal_finish_min_completed_path_length: 5.0
# 搜索耗尽或总超时后的统一兜底。false 时不移动，原地直接 FINISH
fallback_move_enabled: true
# true 时使用以下绝对 map 位姿，收到 HOVER 后 FINISH
fallback_target_x: -1.67
fallback_target_y: -7.16
fallback_target_z: -0.6
fallback_target_yaw_deg: 210.0

# 红线锁定与拟合
line_classes: line
line_lock_window_seconds: 0.3
# 首次锁线后等待曲线冻结的最长时间；超时后只原地搜索一轮
initial_line_freeze_timeout_seconds: 1.0
line_min_confidence: 0.75 # line 置信度下限 中午0.8
line_point_merge_distance: 0.0
line_point_update_alpha: 0.20
line_curve_max_points: 200
line_curve_overlap_points: 40
line_curve_sample_count: 100
line_curve_degree: 3
# 首条线和后续延伸都必须在下方存活时间内累计足够的合格拟合帧才允许固定。
# 合格帧不要求连续；超过存活时间仍未达到数量时，整批未固定数据会被剔除。
curve_freeze_required_frames: 2
curve_freeze_frame_lifetime_seconds: 0.9
curve_freeze_min_length: 0.05
curve_freeze_min_advance: 0.05
curve_freeze_overlap_distance: 0.25
endpoint_growth_tolerance: 0.08
# 最后中点 HOVER 后，待固定尾段小于该值则不搜索、直接结束
endpoint_pending_extension_tolerance: 0.20

# FOLLOW_LINE 每周期按最新位置重算 LOS 中点，不等待 HOVER；定点阶段仍等待 HOVER。
los_lookahead_distance: 0.6
los_midpoint_ratio: 0.50
los_target_update_min_distance: 0.08

# 终点：默认使用未知长度模式。
# 到达最后中点后固定 XY，只搜索一轮“左、右、返回”；无新增长则结束。
endpoint_min_completed_path_length: 5.0
endpoint_stable_frames: 8
endpoint_stable_position_tolerance: 0.12
endpoint_evidence_robot_distance: 0.8
use_known_line_length: false
known_line_length: 3.8
known_line_stop_margin: 0.3

# 黄色/黑色图形识别
yellow_classes: "triangle,circle"
black_classes: rectangle
yellow_min_confidence: 0.30
black_min_confidence: 0.30
max_camera_distance: 5.0
marker_window_size: 10
marker_required_valid: 5
# 固定平均位置所需的聚类一致样本总数（包含确认图形的前5个样本）
marker_position_required_valid: 15
marker_sample_timeout: 10.0
marker_cluster_distance: 0.25
marker_duplicate_distance: 0.60
marker_line_max_distance: 0.50
# 黄色（hand）和黑色（base_link）的投影最多允许超前标志点的距离
marker_progress_tolerance: 0.15

# 每类动作要求次数；到终点时不足也正常结束
yellow_required_count: 2
black_required_count: 2

# 灯光动作
light_seconds: 2.0
gap_seconds: 1.5
yellow_light_count: 1
black_light_count: 2

# 黄色接触动作。黄色按 hand 巡线进度触发并用 hand 水平投影定点；
# 下潜到绝对 Z 深度后由 Task1 按深度误差判断，超时也会自动上浮。
# 回到 Task1 保持深度后仍等待控制端 HOVER。
yellow_contact_enabled: true
yellow_alignment_frame: hand
yellow_contact_depth: -0.15
yellow_contact_depth_tolerance: 0.05
yellow_dive_timeout: 10.0
# 开始上浮后至少等待该时长，再检查 HOVER 并恢复巡线
yellow_return_wait_seconds: 3.0

# 黑色动作：动态超前 90 度，累计一圈后等待最后目标的一次 HOVER
black_rotation_angle_deg: 360.0
black_rotation_direction: 1.0
black_rotation_step_deg: 150.0

# 外设默认值
light1: 0
light2: 0
heading_servo: 128
clamp_servo: 255
drive_cmd: 0
drive_speed: 0

# 数据和 Web
log_directory: ~/.ros/auv_logs/task1
trajectory_publish_period: 0.5
actual_path_min_spacing: 0.03
actual_path_max_points: 2000
web_valid_point_merge_distance: 0.01
web_valid_point_max_count: 20000
trajectory_web_enabled: true
trajectory_web_host: 192.168.1.117
trajectory_web_port: 8083
