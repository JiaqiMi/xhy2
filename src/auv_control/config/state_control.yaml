# 状态监控节点配置：任务由键盘 mode=1、2、3 选择。
keyboard_topic: /auv_keyboard
finished_topic: /finished
finished_keyword: finished
monitor_rate_hz: 2.0
terminate_wait_seconds: 5.0

# M 键开启控制器保活；N 键关闭保活并仅发送一次关闭请求。
motion_supervisor:
  name: motion_supervisor
  launch: motion_supervisor_prototype.launch
  launch_args: []
  node_name: /motion_supervisor
  startup_timeout_seconds: 15.0
  # 节点注册后通过 XML-RPC getPid 确认可通信，避免残留注册误判为运行中。
  health_check_timeout_seconds: 1.0
  # 控制器日志由自身 ROS/CSV 日志目录记录，不转发到 task_control 终端。
  forward_output: false

# 按 9 键启动 task1 视觉预热；启动 task1 时会复用该组节点。
task1_vision_prewarm:
  enabled: true
  name: task1_vision
  launch: task1_vision.launch
  launch_args: []
  reuse_launch_args:
    - start_detection_nodes:=false
  active_modes: [1]

# 设为 false 时不预热，task3 会在自身 launch 中启动三个视觉模型。
# 设为 true 时仅在 task2 启动预热，task3 期间仅复用；若预热不存在，
# 则由 task3.launch 自身同时启动任务与三个视觉模型。
task3_vision_prewarm:
  enabled: true
  name: task3_vision
  launch: task3_vision.launch
  launch_args: []
  reuse_launch_args:
    - start_arrow_model:=false
    - start_aruco_model:=false
    - start_rectangle_model:=false
  active_modes: [2, 3]
  start_modes: [2]

tasks:
  - mode: 1
    name: task1
    launch: task1.launch
    timeout_seconds: 600.0
    launch_args: []
  - mode: 2
    name: task2
    launch: task2.launch
    timeout_seconds: 600.0
    launch_args: []
  - mode: 3
    name: task3
    launch: task3.launch
    timeout_seconds: 600.0
    launch_args: []
