# 状态监控节点配置：任务由键盘 mode=1、2、3 选择。
keyboard_topic: /auv_keyboard
finished_topic: /finished
finished_keyword: finished
monitor_rate_hz: 2.0
terminate_wait_seconds: 5.0

# 设为 false 时不预热，task3 会在自身 launch 中启动三个视觉模型。
# 设为 true 时 task2 预热，task3 复用该组模型而不重复启动。
task3_vision_prewarm:
  enabled: true
  name: task3_vision
  launch: task3_vision.launch
  launch_args: []
  task3_reuse_launch_args:
    - start_arrow_model:=false
    - start_aruco_model:=false
    - start_rectangle_model:=false
  active_modes: [2, 3]

tasks:
  - mode: 1
    name: task1
    launch: task1.launch
    timeout_seconds: 600.0
    launch_args: []
  - mode: 2
    name: task2
    launch: task2.launch
    timeout_seconds: 600.0
    launch_args: []
  - mode: 3
    name: task3
    launch: task3.launch
    timeout_seconds: 600.0
    launch_args: []
