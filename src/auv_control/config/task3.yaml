# 任务3统一运行参数
#
# 本文件是子任务1、子任务2、子任务3和task3_final的唯一调优参数源。
# 修改本文件后，单独运行任一子任务或运行完整任务3都会使用相同参数。
#
# 参数边界：
# 1. 本文件负责识别阈值、帧数、距离、时间、控制增益、到达容差和执行器数值。
# 2. 启动哪些相机、模型、Web节点以及话题重映射仍由launch负责。
# 3. motion_supervisor内部推力、速度、阻尼和HOVER判定参数仍在
#    config/motion_supervisor.yaml中调整，本文件只配置任务侧目标与核对门槛。

# 任务3统一固定深度，单位m，填写水面以下的正深度。
# 当前map坐标约定为水下Z为负，因此0.60m会作为map z=-0.60下发。
# 完整任务、三个独立子任务及旧联调入口都读取这一处参数。
task3_target_depth_m: 0.90


# ============================================================
# 子任务1：箭头搜索、粗对准、方向对准和最后固定前移
# ROS私有参数命名空间：/test_task3_1_acquire_area
# ============================================================
test_task3_1_acquire_area:
  # 主循环与日志
  rate: 5.0
  log_directory: "~/.ros/auv_logs/task3"
  log_interval: 1.0
  warning_log_interval: 2.0

  # 箭头基础识别
  # min_confidence调大可减少误检，调小可增加弱目标召回。
  min_confidence: 0.30
  # 普通位置帧最大允许间隔，同时用于定点方向复核保护。
  detection_timeout: 2.0
  # 运动中完整箭头丢失达到该时间后取消当前目标。
  visual_loss_cancel_seconds: 2.0

  # 箭头位置锁定：最近10个模型帧内，同一位置候选组命中3帧。
  stable_detection_window_size: 10
  stable_detection_count: 3
  # 候选组中心最大二维抖动，单位px。
  stable_center_tolerance_px: 40.0
  # 候选框面积相对中位面积的最大变化比例。
  stable_area_tolerance_ratio: 0.35
  # 方向候选组或连续方向帧的最大角度抖动，单位deg。
  stable_angle_tolerance_deg: 12.0
  # 粗居中和启用时的最终视觉对准连续确认帧数。
  center_stable_detection_count: 2

  # 定点方向复核：10帧内同一角度候选组命中3帧，不要求连续。
  direction_confirm_window_size: 10
  direction_confirm_required_count: 3
  # 机器人运动期间仍要求方向连续稳定2帧，避免使用旧位姿历史帧。
  heading_stable_detection_count: 2
  # 航向与横移联合对准连续通过帧数。
  heading_aligned_detection_count: 2

  # false：最后固定前移前不再检查最终视觉中心、方向和连续帧，
  #        只等待当前目标对应的MotionState.HOVER。
  # true：保留最终视觉中心、方向和连续帧判断。
  enable_final_visual_alignment: false

  # motion_supervisor反馈与取消保护
  motion_state_timeout: 2.0
  motion_startup_timeout: 20.0
  cancel_timeout: 15.0

  # MotionState.goal与任务最近目标的允许差。
  # 这些参数只防止旧HOVER误判，不改变motion_supervisor内部控制精度。
  # 调大更容易通过，调小目标匹配更严格。
  goal_match_position_tolerance: 0.10
  goal_match_depth_tolerance: 0.10
  goal_match_yaw_tolerance_deg: 10.0

  # 独立运行子任务1时的启动悬停和搜索路径。
  initial_hover_seconds: 10.0
  search_initial_forward_distance: 0.70
  search_lateral_distance: 0.30
  search_second_forward_distance: 0.40
  # 子任务1总超时；第一次和第二次箭头都使用该时间。
  # 超时后，整合任务在容错开关开启时直接前往下一子任务人工点。
  max_wait_seconds: 300.0

  # 箭头模型图像尺寸和完整可见门槛
  image_width: 640.0
  image_height: 480.0
  full_arrow_edge_margin_px: 5.0
  full_arrow_min_bbox_width_px: 30.0
  full_arrow_min_bbox_height_px: 30.0

  # 图像目标中心和普通中心容差；0.5/0.5表示图像正中心。
  target_center_u_ratio: 0.5
  target_center_v_ratio: 0.5
  center_tolerance_u_px: 50.0
  center_tolerance_v_px: 50.0

  # 航向对准阶段专用水平容差。
  # 转向时横移不明显可逐步调小；左右振荡时调大。
  heading_lateral_tolerance_px: 20.0

  # 粗对准：归一化v/u误差到前后/左右位置小步的增益，单位m。
  visual_forward_gain_m: 0.20
  visual_lateral_gain_m: 0.20
  visual_max_step_m: 0.50
  visual_min_step_m: 0.05
  visual_goal_min_interval: 1.0
  # 运动方向相反时只修改对应符号为-1.0。
  visual_forward_sign: 1.0
  visual_lateral_sign: 1.0

  # 细对准：航向和横移联合控制以及慢速前后居中。
  fine_forward_gain_m: 0.20
  fine_lateral_gain_m: 0.20
  fine_visual_max_step_m: 0.50
  fine_visual_min_step_m: 0.05
  fine_yaw_max_step_deg: 10.0
  fine_goal_min_interval: 2.0

  # 图像中机器人正前方对应的箭头角度和方向修正符号。
  camera_forward_angle_deg: 90.0
  yaw_correction_sign: 1.0
  yaw_tolerance_deg: 10.0

  # 航向和图像中心对准后，base_link沿当前航向执行的一次性固定前移。
  # 当前实验值为1.0m；目标下发后忽略后续视觉，不回退。
  base_link_forward_offset: 0.5

  # 任务侧离底保护和最终悬停
  status_timeout: 1.0
  min_ground_clearance: 0.40
  ground_clearance_goal_update_threshold: 0.01
  final_hold_seconds: 10.0
  final_hold_timeout: 30.0


# ============================================================
# 子任务2：ArUco识别、亮灯和原地转向
# ROS私有参数命名空间：/test_task3_2_get_task
# ============================================================
test_task3_2_get_task:
  # 主循环与日志
  rate: 10.0
  log_directory: "~/.ros/auv_logs/task3"

  # 固定启动点并保持位置
  hold_map_frame: "map"
  hold_base_frame: "base_link"
  initial_hover_seconds: 10.0
  initial_hover_timeout: 30.0
  hold_pose_timeout: 5.0
  motion_state_timeout: 0.5

  # ArUco识别和亮灯完成后的原地转向
  turn_enabled: true
  # 只能填写left或right。
  turn_direction: "left"
  turn_angle_deg: 95.0
  turn_timeout: 90.0
  turn_stable_seconds: 1.0
  turn_hold_seconds: 1.0

  # 目标匹配门槛：只防止把旧目标的HOVER当作当前目标到达。
  goal_match_position_tolerance: 0.03
  goal_match_depth_tolerance: 0.03
  goal_match_yaw_tolerance_deg: 2.0
  # 实际到达与停稳门槛。
  arrival_position_tolerance: 0.05
  arrival_yaw_tolerance_deg: 5.0
  arrival_max_horizontal_speed: 0.03
  # 航向角速度门槛，单位rad/s。
  arrival_max_yaw_rate: 0.05

  # topic：使用真实ArUco话题；mock：使用下面的模拟ID序列。
  input_mode: "topic"
  min_confidence: 0.50
  # 最近10帧内同一ID命中3帧立即成功，不要求连续。
  recognition_window_size: 10
  required_match_count: 3
  recognition_timeout: 60.0
    # 超过30秒仍未满足3/10帧时，不再继续等待ID，直接按固定颜色执行。
  # recognition_fallback_color只能填写yellow、green或red。
  # 子任务2识别超时；到时直接使用下面的固定颜色并继续亮灯、转向。
  recognition_fallback_seconds: 30.0
  recognition_fallback_color: "red"
  mock_aruco_ids: [1, -1, 1, 2, -1, -1, 1]
  mock_frame_interval: 0.2

  # 识别成功后灯光动作
  light_seconds: 3.0
  gap_seconds: 0.5

  # 执行器协议数值
  actuator_mode: 2
  light1: 0
  light2: 0
  heading_servo: 128
  clamp_servo: 255
  drive_cmd: 0
  drive_speed: 0


# ============================================================
# 子任务3：彩色方框搜索、细对准、开灯和夹爪
# ROS私有参数命名空间：/test_task3_3_inspect_and_drop
# ============================================================
test_task3_3_inspect_and_drop:
  # manual：人工移动，只执行识别和动作；auto：自动搜索和对准。
  operation_mode: "auto"
  rate: 5.0
  log_directory: "~/.ros/auv_logs/task3"
  log_interval: 1.0
  warning_log_interval: 2.0

  # 方框识别
  target_color: "red"
  min_confidence: 0.20
  # 人工模式稳定候选组要求。
  stable_detection_count: 5
  # 自动搜索和刹停后复核共用的滑动窗口。
  stable_detection_window_size: 10
  auto_search_stable_detection_count: 3
  auto_hover_confirm_settle_seconds: 0.5
  auto_hover_confirm_timeout: 4.0
  # 细对准最终居中连续确认帧数。
  auto_center_stable_detection_count: 3
  stable_center_tolerance_px: 40.0
  stable_area_tolerance_ratio: 0.35
  detection_timeout: 2.0
  # 子任务3首次搜索、识别和对准的总超时。
  # 超时后，整合任务前往目标颜色对应的人工方框点原地复核。
  max_wait_seconds: 300.0

  # motion_supervisor反馈和取消保护
  motion_state_timeout: 2.0
  motion_startup_timeout: 20.0
  cancel_timeout: 50.0
  goal_match_position_tolerance: 0.03
  goal_match_depth_tolerance: 0.03
  goal_match_yaw_tolerance_deg: 2.0
  arrival_position_tolerance: 0.05
  arrival_yaw_tolerance_deg: 5.0
  arrival_max_horizontal_speed: 0.02
  arrival_max_yaw_rate_deg_s: 0.5

  # /status/auv反馈
  status_timeout: 1.0
  status_linear_velocity_scale: 1.0

  # 自动搜索：先完成悬停和第一段前进，再观察并排的三个颜色方框。
  auto_initial_hover_seconds: 3.0
  auto_search_first_forward_distance: 0.70
  auto_search_second_forward_distance: 0.30
  auto_search_third_forward_distance: 0.20
  # 左移从当前搜索点计算；右移从左移结束位置计算。
  auto_search_left_distance: 0.50
  auto_search_right_distance: 1.0
  # true：10帧内3帧确认颜色布局，优先直接找目标或推断左右方向。
  # 只看到一个非目标颜色时仍按上面的原左移步长横移；
  # 从左侧跨到右侧仍使用原右移步长。快速判定失败后自动接回原搜索。
  # false：完全跳过颜色布局推断，直接执行原三段定步长搜索。
  auto_color_fast_search_enabled: true

  # 视觉细对准增益和单次位置小步
  auto_visual_forward_gain_m: 0.10
  auto_visual_lateral_gain_m: 0.10
  auto_visual_min_step_m: 0.10
  auto_visual_max_step_m: 0.30
  auto_visual_goal_min_interval: 0.50
  # 实际运动方向相反时改为-1.0。
  auto_forward_sign: 1.0
  auto_lateral_sign: 1.0

  # 方框目标中心、像素容差和图像尺寸回退值
  auto_target_center_u_ratio: 0.5
  auto_target_center_v_ratio: 0.5
  auto_center_tolerance_u_px: 40.0
  auto_center_tolerance_v_px: 40.0
  auto_image_width: 640.0
  auto_image_height: 480.0

  # 自动模式开灯、开夹爪前的动作放行门槛
  auto_action_max_horizontal_speed: 0.03
  auto_action_max_vertical_speed: 0.03
  # 航向角速度门槛，单位rad/s。
  auto_action_max_yaw_rate: 0.05
  auto_action_max_depth_error: 0.08
  auto_action_max_yaw_error_deg: 5.0

  # 动作时序
  # 以下时间均从/status/actuator反馈确认到位后开始计算，
  # 不再用于猜测机械爪是否已经到位。
  # 方框对准后，航向舵机回中且夹爪闭合到位后的保持时间。
  hold_seconds: 1.0
  # 航向舵机位于中间，夹爪打开到位后的保持时间。
  open_seconds: 5.0
  # 夹爪保持打开，航向舵机回到右侧到位后的保持时间。
  return_right_seconds: 1.0
  # 回到右侧并关闭夹爪到位后的保持时间。
  close_seconds: 0.0

  # 执行器反馈到位判定
  # /status/actuator超过该时间没有更新时，暂停到位计数。
  actuator_status_timeout: 1.0
  # 连续多少条反馈同时满足航向舵机和夹爪目标，才确认到位。
  actuator_feedback_confirm_frames: 2
  # 航向舵机和夹爪反馈相对目标值允许的绝对误差。
  actuator_servo_tolerance: 2
  # 每个机械动作等待反馈到位的最长时间，超时则任务失败并安全收爪。
  actuator_stage_timeout: 15.0

  # 投放完成后的自动离场，仅operation_mode=auto时执行。
  post_drop_motion_enabled: true
  # 固定向左转；角度必须大于0且小于180度。
  post_drop_turn_angle_deg: 90.0
  # 左转目标到达HOVER后，沿新的机器人前方移动距离。
  post_drop_forward_distance: 0.10
  # 左转和前进分别使用该到达超时。
  post_drop_step_timeout: 90.0

  # 执行器协议数值
  actuator_mode: 2
  clamp_open: 0
  clamp_closed: 255
  # 方向舵机损坏时设为false：跳过“移到中间”和“回到右侧”，
  # 投放只执行夹爪打开、夹爪闭合，并且到位反馈只判断夹爪。
  # 舵机修复后设为true，即恢复原来的“中间打开、右侧闭合”完整动作。
  heading_servo_enabled: false
  # 航向舵机协议：0=右，128=中，255=左。
  heading_servo_right: 0
  heading_servo_center: 128
  drive_cmd: 0
  drive_speed: 0
  light1: 0
  light2: 0


# ============================================================
# 完整任务3：模型预热、四阶段调度和阶段间HOVER
# ROS私有参数命名空间：/task3_final
# ============================================================
task3_final:
  rate: 10.0
  log_directory: "~/.ros/auv_logs/task3"
  # true：终端只显示关键阶段、识别成功、跳点、超时、警告和错误；
  # 完整逐帧识别、运动反馈和执行器信息仍全部写入上面的单个日志文件。
  console_key_only: true
  # 终端中同类WARNING重复出现的最短间隔；ERROR不做频率限制。
  console_warning_repeat_interval: 3.0

  # 等待三个模型开始持续发布的最长时间和最低帧数。
  model_ready_timeout: 90.0
  model_required_frames: 3
  model_output_timeout: 2.0
  model_recovery_timeout: 10.0

  # 子任务切换时等待motion_supervisor稳定HOVER。
  handoff_timeout: 30.0
  handoff_stable_seconds: 2
  motion_state_timeout: 2.0
  # 启动时锁存map到base_link固定悬停点的最长等待时间。
  startup_tf_timeout: 8.0

  # 子任务超时跳点容错总开关。第一版只依据上面三个子任务的时间参数
  # 判断是否跳点，不做目标是否超出相机视野的推断。
  # 填完下面8组人工测量点并完成水下验证后，再手动改为true。
  timeout_skip_enabled: false
  # 从当前刹停点移动到下一阶段人工测量点的最长时间。
  timeout_skip_move_timeout: 120.0
  # motion_supervisor到达目标并进入HOVER后，还需连续稳定的时间。
  timeout_skip_arrival_stable_seconds: 2.0
  # 子任务3首次超时并到达指定颜色方框点后，只在原地重新识别和对准，
  # 不再执行前进、左右搜索；超过该时间仍失败则不投放并前往出口点。
  box_point_recheck_timeout: 30.0

  # 所有点都是执行reset_world_origin.launch成功后，map坐标系中的绝对目标。
  # x、y单位m；yaw_deg单位deg；深度统一使用文件顶部task3_target_depth_m。
  # 开关为false时允许保留“待测”；开关改为true前必须全部换成有限数字。
  timeout_skip_targets:
    # 整个任务3入口点；前一个大任务（任务2）超时后也移动到这里开始任务3。
    task3_start:
      x: "待测"
      y: "待测"
      yaw_deg: "待测"
    # 第一次箭头正常完成或超时后，都移动到子任务2的ArUco识别点。
    subtask2:
      x: "待测"
      y: "待测"
      yaw_deg: "待测"
    # 子任务2完成固定颜色兜底/正常识别及90度转向后，移动到第二个箭头起始点。
    # ArUco识别超时由子任务2内部处理，不在总调度层跳过。
    # yaw_deg填写完成该90度转向后，第二个箭头阶段期望保持的map绝对航向。
    second_arrow:
      x: "待测"
      y: "待测"
      yaw_deg: "待测"
    # 第二次箭头正常完成或超时后，都移动到子任务3彩色方框任务的起始点。
    subtask3:
      x: "待测"
      y: "待测"
      yaw_deg: "待测"
    # 子任务3首次识别超时后，根据ArUco得到的目标颜色选择其中一个点。
    # 三个点应设置在机器人能够从下视相机看到对应颜色方框的位置。
    box_red:
      x: "待测"
      y: "待测"
      yaw_deg: "待测"
    box_yellow:
      x: "待测"
      y: "待测"
      yaw_deg: "待测"
    box_green:
      x: "待测"
      y: "待测"
      yaw_deg: "待测"
    # 正常投放完成或颜色点原地复核仍超时后，都移动到任务3出口点。
    mission_exit:
      x: "待测"
      y: "待测"
      yaw_deg: "待测"

  # 整合模式已经在模型预热和阶段交接中统一悬停，因此关闭子任务内部
  # 重复的启动与结束等待。独立运行子任务时仍使用各子任务自己的参数。
  subtask1_initial_hover_seconds: 0.0
  subtask1_final_hold_seconds: 0.0
  subtask2_initial_hover_seconds: 0.0
  subtask2_turn_hold_seconds: 0.0
  subtask3_initial_hover_seconds: 0.0
