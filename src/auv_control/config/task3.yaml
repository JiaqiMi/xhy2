# 任务3统一运行参数
#
# 本文件是子任务1、子任务2、子任务3和task3_final的唯一调优参数源。
# 修改本文件后，单独运行任一子任务或运行完整任务3都会使用相同参数。
#
# 参数边界：
# 1. 本文件负责识别阈值、帧数、距离、时间、控制增益、到达容差和执行器数值。
# 2. 启动哪些相机、模型、Web节点以及话题重映射仍由launch负责。
# 3. motion_supervisor内部推力、速度、阻尼和HOVER判定参数仍在
#    config/motion_supervisor.yaml中调整，本文件只配置任务侧目标与核对门槛。

# 任务3统一固定深度，单位m，填写水面以下的正深度。
# 当前map坐标约定为水下Z为负，因此0.60m会作为map z=-0.60下发。
# 完整任务、三个独立子任务及旧联调入口都读取这一处参数。
task3_target_depth_m: 0.1

# 完整任务3启动时锁存机器人当前map N/E，并调整到该map绝对航向。
# 该参数始终生效，与子任务超时跳点容错开关无关，单位deg。
task3_initial_yaw_deg: 210.0

# 运行安全检查参数，不属于阶段最终超时，也不会触发总调度恢复或重试。
# motion_feedback_timeout只判断运动反馈是否新鲜。
# [HOVER超时-1] cancel_recovery_timeout统一控制子任务1的camera粗对准、
# 当前位置保持，以及子任务3当前位置保持等待HOVER。
task3_protection:
  motion_feedback_timeout: 3.0
  cancel_recovery_timeout: 600.0


# ============================================================
# 子任务1：箭头搜索、camera粗对准、HOVER后精确认和最终定位
# ROS私有参数命名空间：/test_task3_1_acquire_area
# ============================================================
test_task3_1_acquire_area:
  # 主循环与日志
  rate: 5.0
  log_directory: "~/.ros/auv_logs/task3"
  log_interval: 1.0
  warning_log_interval: 2.0

  # 箭头基础识别
  # 位置帧先独立判断；局部箭头只要检测和深度有效即可进入位置窗口。
  min_confidence: 0.4
  # 精确认阶段方向有效帧的最低置信度。
  direction_start_confidence: 0.5
  # 位置话题和方向话题分别允许的最大数据年龄。
  detection_timeout: 2.0

  # 第一、第三步位置确认：只把有效三维位置写入最多10帧的队列；
  # 队列中任意3帧相对其平均位置的最大二维距离不超过下面容差即通过。
  stable_detection_window_size: 10
  stable_detection_count: 3
  # 三帧位置相对其平均map位置的最大二维距离，单位m。
  stable_map_position_tolerance_m: 0.20
  # camera粗对准并进入HOVER后，重新得到的三帧平均位置与首次平均位置
  # 之间允许的最大二维距离，单位m。
  fine_position_match_tolerance_m: 0.20
  # 方向候选组的最大角度抖动，单位deg。
  stable_angle_tolerance_deg: 12.0

  # 第三步方向确认：最多保留10个有效方向帧；要求与三帧稳定位置
  # 来自同一批推理时间戳，并且三个方向相对圆周平均值的误差都在上面容差内。
  direction_confirm_window_size: 10
  direction_confirm_required_count: 3

  # motion_supervisor首次反馈等待；运行期反馈和取消保护统一读取
  # 文件顶部task3_protection，不在各子任务重复配置。
  motion_startup_timeout: 20.0

  # MotionState.goal与任务最近目标的允许差。
  # 这些参数只防止旧HOVER误判，不改变motion_supervisor内部控制精度。
  # 调大更容易通过，调小目标匹配更严格。
  goal_match_position_tolerance: 0.10
  goal_match_depth_tolerance: 0.10
  goal_match_yaw_tolerance_deg: 10.0

  # 独立运行子任务1时的启动悬停和搜索路径。
  initial_hover_seconds: 10.0
  # 按相机到箭头平面0.80m、水平/垂直视场86/56deg估算：
  # 单帧约覆盖左右1.49m、前后0.85m。搜索分成三段，每段先到中线
  # 正前方，再左扫、右扫并回到中线；左右端点各0.75m、段间0.65m，
  # 前后视野约重叠24%，理论连续覆盖约2.99m x 2.15m = 6.44m^2。
  search_initial_forward_distance: 0.6
  search_lateral_distance: 0.5
  search_second_forward_distance: 0.65
  search_third_forward_distance: 0.65
  # 箭头子任务独立运行时的默认最终超时，从首次搜索运动目标开始计时；
  # 完整任务中的第一次、第二次箭头分别使用task3_final下的独立参数。
  # 三段搜索走完后保持最后搜索点继续识别，不提前失败；达到该时间后，
  # 第一次箭头直接前往ArUco点，第二次箭头直接前往方框点，不恢复、不重试。
  max_wait_seconds: 120.0

  # 箭头模型图像尺寸和bbox信息仅用于日志，不参与新流程的方向通过条件。
  image_width: 640.0
  image_height: 480.0
  full_arrow_edge_margin_px: 5.0
  full_arrow_min_bbox_width_px: 30.0
  full_arrow_min_bbox_height_px: 30.0

  # 图像中心只用于日志记录。
  target_center_u_ratio: 0.5
  target_center_v_ratio: 0.5

  # 图像中机器人正前方对应的箭头角度和方向修正符号。
  camera_forward_angle_deg: 90.0
  yaw_correction_sign: 1.0

  # 第四步：精确认通过后冻结箭头map位置和平均方向，一次下发固定的
  # base_link位置与航向目标；不再单独执行航向对准或camera精对准。

  # 最终悬停
  status_timeout: 1.0
  final_hold_seconds: 0.0
  # [HOVER超时-2] 子任务1最终base_link目标进入HOVER并完成稳定保持。
  final_hold_timeout: 600.0


# ============================================================
# 子任务2：ArUco识别、亮灯和原地转向
# ROS私有参数命名空间：/test_task3_2_get_task
# ============================================================
test_task3_2_get_task:
  # 主循环与日志
  rate: 10.0
  log_directory: "~/.ros/auv_logs/task3"

  # 固定启动点并保持位置
  hold_map_frame: "map"
  hold_base_frame: "base_link"
  initial_hover_seconds: 10.0
  # [HOVER超时-3] 子任务2识别前固定目标进入HOVER。
  initial_hover_timeout: 600.0
  hold_pose_timeout: 5.0
  # 运行期运动反馈保护统一读取文件顶部task3_protection。

  # ArUco识别和亮灯完成后的原地转向
  turn_enabled: true
  # 只能填写left或right。
  turn_direction: "left"
  turn_angle_deg: 90.0
  # [HOVER超时-4] 子任务2识别完成后的原地转向目标进入HOVER。
  turn_timeout: 600.0
  turn_stable_seconds: 1.0
  turn_hold_seconds: 1.0

  # 目标匹配门槛：只防止把旧目标的HOVER当作当前目标到达。
  goal_match_position_tolerance: 0.03
  goal_match_depth_tolerance: 0.03
  goal_match_yaw_tolerance_deg: 2.0
  # 实际到达与停稳门槛。
  arrival_position_tolerance: 0.05
  arrival_yaw_tolerance_deg: 5.0
  arrival_max_horizontal_speed: 0.03
  # 航向角速度门槛，单位rad/s。
  arrival_max_yaw_rate: 0.05

  # topic：使用真实ArUco话题；mock：使用下面的模拟ID序列。
  input_mode: "topic"
  min_confidence: 0.50
  # 最近10帧内同一ID命中3帧立即成功，不要求连续。
  recognition_window_size: 10
  required_match_count: 3
  recognition_timeout: 40.0
  # 实时识别超过15秒仍未满足3/10帧时，优先使用任务开始以来
  # 已记录的三帧一致ArUco历史ID；没有历史ID才按人工颜色继续执行。
  # recognition_fallback_color只能填写yellow、green或red。
  recognition_fallback_seconds: 15.0
  recognition_fallback_color: "red"
  mock_aruco_ids: [1, -1, 1, 2, -1, -1, 1]
  mock_frame_interval: 0.2

  # 识别成功后灯光动作
  # 亮灯和灭灯均需/status/actuator连续反馈到位后才开始计时。
  light_seconds: 3.0
  gap_seconds: 0.5

  # 执行器协议数值
  actuator_mode: 2
  actuator_status_topic: "/status/actuator"
  actuator_status_timeout: 1.0
  actuator_feedback_confirm_frames: 2
  actuator_stage_timeout: 15.0
  light1: 0
  light2: 0
  # 三色灯下发时自动保持/status/actuator中的实际方向舵机和夹爪位置。
  drive_cmd: 0
  drive_speed: 0


# ============================================================
# 子任务3：彩色方框搜索、细对准、开灯和夹爪
# ROS私有参数命名空间：/test_task3_3_inspect_and_drop
# ============================================================
test_task3_3_inspect_and_drop:
  # manual：人工移动，只执行识别和动作；auto：自动搜索和对准。
  operation_mode: "auto"
  rate: 5.0
  log_directory: "~/.ros/auv_logs/task3"
  log_interval: 1.0
  warning_log_interval: 2.0

  # 方框识别
  target_color: "red"
  min_confidence: 0.20
  # 自动模式订阅带三维位置和原始时间戳的TargetDetection；人工模式仍可使用JSON检测话题。
  model_target_topic: "/vision/rectangle/target_message"
  # 人工模式稳定候选组要求。
  stable_detection_count: 5
  # 自动模式最多保留10个有效map位置帧；任意3帧相近即通过。
  stable_detection_window_size: 10
  auto_search_stable_detection_count: 3
  # 三帧map位置相对平均值的最大二维抖动，单位m。
  stable_map_position_tolerance_m: 0.20
  # camera粗对准后，二次三帧平均位置与首次平均位置的X误差门槛，单位m。
  fine_position_x_tolerance_m: 0.10
  auto_hover_confirm_settle_seconds: 0.5
  auto_hover_confirm_timeout: 4.0
  # 细对准最终居中连续确认帧数。
  auto_center_stable_detection_count: 3
  stable_center_tolerance_px: 40.0
  stable_area_tolerance_ratio: 0.35
  detection_timeout: 2.0
  # 子任务3独立运行时的默认最终超时，从首次实际运动目标开始计时；
  # 完整任务使用task3_final.box_timeout_seconds覆盖该值。
  # 预设搜索路径走完后保持末点继续识别。
  # 超时后不再恢复或重试，整合任务先原地左转，再返回map/NED原点并上浮结束。
  max_wait_seconds: 120.0

  # motion_supervisor首次反馈等待；运行期反馈和取消保护统一读取
  # 文件顶部task3_protection，不在各子任务重复配置。
  motion_startup_timeout: 20.0
  goal_match_position_tolerance: 0.03
  goal_match_depth_tolerance: 0.03
  goal_match_yaw_tolerance_deg: 2.0
  arrival_position_tolerance: 0.05
  arrival_yaw_tolerance_deg: 5.0
  arrival_max_horizontal_speed: 0.02
  arrival_max_yaw_rate_deg_s: 0.5

  # /status/auv反馈
  status_timeout: 1.0
  status_linear_velocity_scale: 1.0

  # 自动搜索：先完成悬停和第一段前进，再观察并排的三个颜色方框。
  auto_initial_hover_seconds: 3.0
  auto_search_first_forward_distance: 0.50
  auto_search_second_forward_distance: 0.30
  auto_search_third_forward_distance: 0.20
  # 左移从当前搜索点计算；右移从左移结束位置计算。
  auto_search_left_distance: 0.50
  auto_search_right_distance: 1.0
  # true：10帧内3帧确认颜色布局，优先直接找目标或推断左右方向。
  # 只看到一个非目标颜色时仍按上面的原左移步长横移；
  # 从左侧跨到右侧仍使用原右移步长。快速判定失败后自动接回原搜索。
  # false：完全跳过颜色布局推断，直接执行原三段定步长搜索。
  auto_color_fast_search_enabled: true

  # map精对准小步参数：XY均可移动，但精确认只判断X误差；航向始终保持锁存值。
  auto_visual_lateral_gain_m: 0.10
  auto_visual_min_step_m: 0.05
  auto_visual_max_step_m: 0.20
  auto_visual_goal_min_interval: 0.50
  # 实际运动方向相反时改为-1.0。
  auto_lateral_sign: 1.0

  # 图像对准参考点、像素容差和图像尺寸回退值。
  # 640宽图像下，方框水平中心进入画面中心左右各60px后才开始稳定确认；
  # v方向只写日志，不参与对准。单侧贴住画面边缘时仍继续横向细对准。
  auto_target_center_u_ratio: 0.5
  auto_target_center_v_ratio: 0.5
  auto_center_tolerance_u_px: 60.0
  auto_image_width: 640.0
  auto_image_height: 480.0

  # 自动模式开灯、开夹爪前的动作放行门槛
  auto_action_max_horizontal_speed: 0.03
  auto_action_max_vertical_speed: 0.03
  # 航向角速度门槛，单位rad/s。
  auto_action_max_yaw_rate: 0.05
  auto_action_max_depth_error: 0.08
  auto_action_max_yaw_error_deg: 5.0

  # 自动模式精确认通过、锁定位置和航向后，开灯和开爪前沿当前航向前进20厘米。
  pre_drop_forward_distance: 0.20
  # [HOVER超时-5] 子任务3投放前固定前进目标进入HOVER。
  pre_drop_forward_timeout: 600.0

  # 动作时序
  # 以下时间均从/status/actuator反馈确认到位后开始计算，
  # 不再用于猜测机械爪是否已经到位。
  # 方框对准后，航向舵机回中且夹爪闭合到位后的保持时间。
  hold_seconds: 1.0
  # 航向舵机位于中间，夹爪打开到位后的保持时间。
  open_seconds: 5.0
  # 夹爪保持打开，航向舵机回到右侧到位后的保持时间。
  return_right_seconds: 1.0
  # 回到右侧并关闭夹爪到位后的保持时间。
  close_seconds: 0.0

  # 执行器反馈到位判定
  # /status/actuator超过该时间没有更新时，暂停到位计数。
  actuator_status_timeout: 1.0
  # 连续多少条反馈同时满足航向舵机和夹爪目标，才确认到位。
  actuator_feedback_confirm_frames: 2
  # 航向舵机和夹爪反馈相对目标值允许的绝对误差。
  actuator_servo_tolerance: 2
  # 每个机械动作等待反馈到位的最长时间，超时则任务失败并安全收爪。
  actuator_stage_timeout: 15.0

  # 投放完成后的自动离场，仅operation_mode=auto时执行；
  # 方框识别超时后的统一收尾也复用下面的左转、返航和上浮参数。
  post_drop_motion_enabled: true
  # 固定向左转；角度必须大于0且小于180度。
  post_drop_turn_angle_deg: 90.0
  # [HOVER超时-6] 子任务3投放后左转、返回map原点分别等待HOVER。
  post_drop_step_timeout: 600.0
  # 到达map原点后的绝对NED/map上浮目标z；NED z向下为正，值越小表示越向上。
  post_drop_ascent_target_z: -1.3
  # 上浮目标持续发布时间，到时结束全部流程。
  post_drop_ascent_seconds: 5.0

  # 执行器协议数值
  actuator_mode: 2
  clamp_open: 0
  clamp_closed: 255
  # 方向舵机损坏时设为false：跳过“移到中间”和“回到右侧”，
  # 投放只执行夹爪打开、夹爪闭合，并且到位反馈只判断夹爪。
  # 舵机修复后设为true，即恢复原来的“中间打开、右侧闭合”完整动作。
  heading_servo_enabled: false
  # 航向舵机协议：0=右，128=中，255=左。
  heading_servo_right: 0
  heading_servo_center: 128
  drive_cmd: 0
  drive_speed: 0
  light1: 0
  light2: 0


# ============================================================
# 完整任务3：四阶段调度、启动模型检查和单层最终超时保护
# ROS私有参数命名空间：/task3_final
# ============================================================
task3_final:
  rate: 10.0
  log_directory: "~/.ros/auv_logs/task3"
  # true：终端只显示关键阶段、识别成功、跳点、超时、警告和错误；
  # 四路原始识别帧、运动反馈和执行器信息仍全部写入上面的单个日志文件。
  console_key_only: true
  # 终端中的识别窗口、运动等待和执行器反馈进度统一限频。
  # 0.5秒对应最高约2Hz；状态切换、3/10确认、子任务开始/结束不受此限制。
  console_progress_interval: 0.5
  # 终端中同类WARNING重复出现的最短间隔；ERROR不做频率限制。
  console_warning_repeat_interval: 3.0

  # [HOVER超时-7] 等待三个模型链路就绪且启动固定目标进入HOVER。
  model_ready_timeout: 600.0
  # 箭头方向只统计不同关键点源帧，避免定时器重复发布虚假满足帧数；
  # 箭头三维位置因目标未进入画面时不会发布有效消息，启动只检查发布端连接。
  # ArUco和方框仍按实际话题帧数检查；进入阶段后不再增加额外复查超时。
  model_required_frames: 3
  model_output_timeout: 2.0

  # 最终超时后移动到下一阶段标志点，HOVER还需连续稳定的时间。
  handoff_stable_seconds: 2
  # 启动时锁存map到base_link固定悬停点的最长等待时间。
  startup_tf_timeout: 8.0

  # 三个识别阶段各自独立的最终超时，均从该阶段首次实际运动目标开始计时。
  # 修改其中一个不会影响另外两个；ArUco继续使用自己的识别超时参数。
  arrow1_timeout_seconds: 240.0
  arrow2_timeout_seconds: 240.0
  box_timeout_seconds: 240.0

  # 唯一最终超时处理始终启用，不再提供三级保护开关或阶段重试。
  # [HOVER超时-8] 箭头最终超时后，下一阶段人工测量点目标进入HOVER。
  final_timeout_move_timeout: 600.0
  # motion_supervisor到达目标并进入HOVER后，还需连续稳定的时间。
  final_timeout_arrival_stable_seconds: 2.0
  # 所有点都是执行reset_world_origin.launch成功后，map坐标系中的绝对目标。
  # N（北向）、E（东向）单位m；yaw_deg单位deg；
  # 深度统一使用文件顶部task3_target_depth_m。
  final_timeout_targets:
    # 第一次箭头达到总超时后，才移动到子任务2的ArUco识别点。
    # 正常完成时留在当前位置，稳定HOVER后直接进入ArUco子任务。
    aruco:
      N: "-4.56"
      E: "-6.77"
      yaw_deg: "210"
    # ArUco完成识别和90度转向后，第二个箭头直接从当前位置开始；
    # 第二次箭头达到总超时后，才移动到统一的彩色方框点。
    # 正常完成时留在当前位置，稳定HOVER后直接进入彩色方框子任务。
    # 该点只用于第二次箭头达到总超时后的子任务3交接。
    # 子任务3自身识别和对准超时后不再回到该点，直接返回map原点并上浮。
    box:
      N: "-5.95"
      E: "-5.25"
      yaw_deg: "120"
