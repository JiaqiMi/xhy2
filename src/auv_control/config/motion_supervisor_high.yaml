# motion_supervisor 高速参数
# 记录：
# 2026.7.31
#   由低速完整参数建立 high 档，目标为 X 约 0.20 m/s、Y 约 0.10 m/s、
#   Yaw 约 20 deg/s；保留当前最大输出、有效减速度和刹车速度环参数。
# 2026.7.31
#   根据远距离任务制动力矩余量，提高 high 档三轴计划减速度。
# 2026.7.31
#   根据手控满力矩跨零速标定，按近零速减速度中位数保留 10% 余量更新六方向有效减速度。
# 2026.8.1
#   根据 260801 data1 的定角与连续旋转测试，降低近目标角速度参考、提高速度跟踪，
#   并提高计划刹转建立速度和停车余量；保留当日已标定的有效刹转减速度与 MZ 限幅。
# 2026.8.1
#   根据 260801 data2，限制短角度动作的目标角速度，并将三轴捕获标准收紧到航向 1 deg、位置 0.04 m。
# 2026.8.1
#   根据 260801 data3，连续旋转的重复刹停只发生在最终定点的低速回摆，
#   提高 Yaw 刹车进入阈值以保留主刹停并抑制微小回摆重复锁存。
# 2026.8.1
#   根据 data3 的 5 Hz 连续旋转逐帧分析，降低负向角速度反馈限环，并降低重规划后的参考 jerk；
#   不修改状态机、目标回调、速度反馈滤波或已标定的刹转减速度。
# 2026.8.1
#   依据 data3 的 MZ 饱和分布，降低两向跟踪增益并取消每周期输出限斜率；
#   连续旋转 5 Hz 的重规划阈值提高到实测目标步长 10.11 deg 之上，保留大目标更新响应。

# 运动管理层控制频率与反馈处理
pure_depth_control: true    # true：全程 mode=2，由上位机统一控制并在稳定后进入 HOVER
control_rate_hz: 8.0       # 统一三轴速度闭环频率；目标可保持 5 Hz 发布
feedback_timeout: 0.5       # TF 或速度反馈最大允许间隔，单位 s，超时后进入 SAFE
velocity_filter_alpha: 0.50 # 速度一阶低通新数据权重，范围 (0,1]，越大响应越快


yaw_rate_to_map_sign: -1.0  # 原始 /status/vel.r 到 map 航向角速度的符号；当前 MZ 与 r 方向相反，取 -1。
pitch_offset_deg: 0.0       # 发送目标姿态时附加的固定俯仰角，单位 deg
startup_hover_frames: 5     # 首帧锁定位姿进入 HOVER 后保持的发布帧数，完成后才执行缓存任务目标

# log参数
# 每个控制周期的完整 CSV 记录；目录中的 ~ 会展开为运行节点用户的主目录
log_enabled: true                                 # 是否记录当前/目标位姿、速度、状态、模式和力矩等完整数据
log_directory: ~/.ros/auv_logs/motion_supervisor  # CSV 日志目录，每次启动自动新建带时间戳文件
log_flush_every: 10.0                              # 每累计多少个控制周期刷新磁盘，20 Hz 下约每秒刷新
log_max_file_size_mb: 50.0                        # 单个 CSV 最大 50 MiB，后续分卷追加 _1、_2 等编号
power_feedback_timeout: 1.0                       # /status/power 超过此时间未更新时标记为不新鲜，不影响控制

# 正常跟踪与主动刹车共用方向性限幅和步长；参数后缀表示实际输出正负号。
# 统一负轴是正轴的1.5倍，便于调参
max_tx_positive: 2000.0             # 正 TX 最大值
max_tx_negative: 3000.0             # 负 TX 绝对值上限
max_ty_positive: 4000.0             # 正 TY 最大值
max_ty_negative: 6000.0             # 负 TY 绝对值上限
max_mz_positive: 3000.0             # 正 MZ 最大值
max_mz_negative: 4500.0             # 负 MZ 绝对值上限
force_slew_per_cycle: 10000.0       # 等于协议上限，取消每周期 TX/TY/MZ 限斜率；各轴最大输出限幅仍生效

# 已停用：主动刹车不再使用独立最大限幅和步长，保留末次值供历史配置对照。
# brake_max_tx_positive: 2000.0
# brake_max_tx_negative: 2250.0
# brake_max_ty_positive: 4000.0
# brake_max_ty_negative: 6000.0
# brake_max_mz_positive: 3000.0
# brake_max_mz_negative: 3500.0
# brake_force_slew_per_cycle: 10000.0

# 统一三轴速度环增益；yaw 的正负按 map 航向角速度误差选择，对应最终 MZ 正负。
kv_x_positive: 20000.0              # 高速首轮：提高正向速度误差对应的 TX
kv_x_negative: 22000.0              # 高速首轮：保留负向推进效率差异
kv_y_positive: 45000.0              # 高速首轮：目标正向约 0.10 m/s
kv_y_negative: 65000.0              # 高速首轮：目标负向约 0.10 m/s
kp_yaw_positive: 25000.0            # data3 正转误差 P90=6.45 deg/s 时可避免持续触及 +3000，先消除跟踪饱和
kp_yaw_negative: 25000.0            # data3 反转误差 P10=-9.72 deg/s 时可避免持续触及 -4500，抑制原始 MZ 来回饱和

# 定点模式锁存制动时的速度环增益；仍按最终 TX/TY 输出符号区分正反车效率。
brake_kv_x_positive: 20000.0
brake_kv_x_negative: 24000.0        # 降低负 TX 制动速度误差放大，抑制执行滞后后的反向加速
brake_kv_y_positive: 40000.0
brake_kv_y_negative: 60000.0
# 定点模式锁存刹转时的角速度环增益；按最终 MZ 输出符号区分正反转效率。
brake_kp_yaw_positive: 9000.0
brake_kp_yaw_negative: 14000.0      # data4 表明负 MZ 刹转过强；反向保护后恢复保守增益

# 已停用的旧式比例刹车参数：正常定点、取消和 SAFE 均改用受限减速轨迹、
# 减速度前馈和方向性速度环；保留原值仅供历史标定记录，不参与加载。
# brake_gain_tx_positive: 20000.0
# brake_gain_tx_negative: 30000.0
# brake_gain_ty_positive: 40000.0
# brake_gain_ty_negative: 60000.0
# brake_gain_mz_positive: -4000.0
# brake_gain_mz_negative: -6000.0
# brake_min_mz: 100.0

# 各轴独立停车距离模型；后缀表示实际刹车输出力或力矩的符号
brake_acceleration_tx_positive: 0.045 # +2000 跨零速实测中位数约 0.050 m/s^2，保留 10% 余量
brake_acceleration_tx_negative: 0.101 # -3000 跨零速实测中位数约 0.112 m/s^2，保留 10% 余量
brake_acceleration_ty_positive: 0.068 # +4000 跨零速实测中位数约 0.075 m/s^2，保留 10% 余量
brake_acceleration_ty_negative: 0.039 # -6000 跨零速实测中位数约 0.043 m/s^2，保留 10% 余量

# 制动速度轨迹的计划减速度与推进器有效减速度分开配置；方向性增益和限幅继续反映正反车差异。
brake_reference_acceleration_tx_positive: 0.022 # 正 TX 制动峰值未碰限，提高计划减速度并保留力矩余量
brake_reference_acceleration_tx_negative: 0.020 # 负 TX 制动已使用约 65% 限幅，保守提高避免过冲
brake_reference_acceleration_ty_positive: 0.010 # 正 TY 制动已使用约 66% 限幅，保留耦合补偿余量
brake_reference_acceleration_ty_negative: 0.012 # 两向统一计划减速度，方向差异仍由有效值保留
angular_brake_acceleration_mz_positive: 0.242   # +3000 跨零速实测约 15.39 deg/s^2，保留 10% 后换算为 rad/s^2
angular_brake_acceleration_mz_negative: 0.389   # -4500 跨零速实测约 24.78 deg/s^2，保留 10% 后换算为 rad/s^2
angular_brake_reference_acceleration_mz_positive_deg_s2: 3.50 # 计划值仍显著低于 +MZ 标定有效减速度，减少长时间低力矩刹转
angular_brake_reference_acceleration_mz_negative_deg_s2: 3.50 # 计划值仍显著低于 -MZ 标定有效减速度，正反向使用同一首轮轨迹
control_delay: 0.45                 # 反馈、计算、通信和执行的综合延迟估计，单位 s
brake_margin_tx_positive: 0.03      # data7 原 0.18 m 导致距目标约 0.12 m 已停低速并重复制动
brake_margin_tx_negative: 0.03      # 与内部位置死区一致，并保留实测减速度偏差的防超调余量
brake_margin_ty_positive: 0.03      # 与三轴内部位置死区统一，给 Y 轴保留无超调余量
brake_margin_ty_negative: 0.03      # 与三轴内部位置死区统一，给 Y 轴保留无超调余量
yaw_brake_margin_positive_deg: 0.8  # 航向捕获标准收紧为 1 deg；由低位置增益提前降速，余量须小于捕获容差
yaw_brake_margin_negative_deg: 0.8  # 与正向一致，满足核心参数校验并保留 0.2 deg 捕获裕量

# 进入hover阈值
capture_radius: 0.04                  # 两种模式到达 HOVER 的外层水平位置误差，满足旋转时位置精度 4 cm
control_center_hold_tolerance: 0.03   # 当前锁存控制中心的二维圆形位置死区，单位 m
horizontal_speed_threshold: 0.008     # data6 中 0.01 m/s 仍持续漂移，收紧三轴停稳判定
yaw_tolerance_deg: 1.0                # 最终航向允许误差，单位 deg
yaw_control_tolerance_deg: 1.0        # mode=2 上位机航向保持死区，与最终航向精度一致
yaw_rate_threshold_deg_s: 0.3         # 判定转动停稳的角速度上限，单位 deg/s
stable_frames: 5                      # 捕获或停稳条件需连续满足的控制帧数，20 Hz 下约为 0.25 s

# 退出hover的滞回阈值；与捕获阈值形成滞回，避免频繁进出 HOVER。
hover_exit_position_error: 0.12       # 两种模式统一的 HOVER 水平退出阈值；与捕获阈值形成滞回
hover_exit_yaw_error_deg: 8.0         # HOVER 航向退出及 Yaw 制动持续远离目标的统一误差阈值
hover_exit_hold_seconds: 0.50         # HOVER 或 Yaw 制动误差连续超限达到此时间才恢复跟踪
mode_ack_timeout: 1.0                 # 接管确认及 HOVER 模式反馈最大允许间隔，单位 s

# 已停用：mode=4 不再使用独立接管保持和异常回退阈值。
# capture_exit_radius: 0.25
# hover_fault_position_error: 0.40
# hover_fault_speed: 0.15
# hover_fault_yaw_rate_deg_s: 5.0
# hover_fault_yaw_error_deg: 20.0

# 统一三轴位置-速度-力控制。
xy_max_speed: 0.30
xy_position_gain: 2.00
xy_max_acceleration: 0.40
xy_max_jerk: 0.40
xy_brake_jerk: 0.20  # 定点制动速度参考的最大 jerk，单位 m/s^3

# 预测停车距离内且合速度达到进入阈值时锁存刹停；低于退出阈值才恢复跟踪。
xy_brake_enter_speed: 0.020
xy_brake_exit_speed: 0.012
yaw_max_rate_deg_s: 25.0
yaw_position_gain: 0.22 # 仅在 120 deg 及以上动作达到 25 deg/s；短角度动作提前收敛，避免反复刹转
yaw_max_acceleration_deg_s2: 20.0
yaw_max_jerk_deg_s3: 35.0 # 5 Hz 前视目标跨过 5 deg 重规划阈值后，减小角速度参考恢复时的力矩阶跃；不影响刹转 jerk
yaw_brake_jerk_deg_s3: 15.0 # 8 Hz 下缩短刹转加速度建立时间，避免计划减速度长期低于实际停车需求

# 航向刹停迟滞；高于 0.6 deg/s 才进入，低于 0.2 deg/s 才退出。
yaw_brake_enter_rate_deg_s: 1.5 # data3 残余约 0.7 deg/s 不再触发重复刹转；主刹停速度仍远高于此阈值
yaw_brake_exit_rate_deg_s: 0.3  # 保持进入/退出滞回，最终 HOVER 仍要求角速度不大于 0.3 deg/s

# 速度反馈实测约 7 Hz；退出刹车前连续低速保持 0.40 s，防止低速采样抖动反复进出刹车。
brake_release_hold_seconds: 0.40
goal_static_capture_seconds: 0.80

# 目标仍然逐帧更新；仅超过以下阈值才重置速度/角速度参考和捕获计时。
goal_replan_position_threshold: 0.10 # 位置目标变化的重规划阈值，单位 m
goal_replan_yaw_threshold_deg: 15.0 # 5 Hz 连续旋转实测相邻目标最大 10.11 deg 不重规划；大于 12 deg 的新任务目标仍完整重规划
control_dt_min: 0.02
control_dt_max: 0.20

# 推进器有效性矩阵 [ax, ay, yaw_rate] = B * [TX, TY, MZ]。
effectiveness_x_tx: 1.0
effectiveness_x_ty: 0.0
effectiveness_x_mz: 0.0
effectiveness_y_tx: -0.12 # data1/data2 均确认 TX 对 Y 为负耦合；按 data2 收敛幅值
effectiveness_y_ty: 1.0
effectiveness_y_mz: 0.0
effectiveness_yaw_tx: 0.0
effectiveness_yaw_ty: 0.0
effectiveness_yaw_mz: 1.0
effectiveness_min_determinant: 0.05
